<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CodeToUI Playground</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-title sidebar-title-row">
        <span>Project</span>
        <span class="status" id="sync-status">connecting…</span>
      </div>
      <button class="project-switch" id="projects-toggle">
        <span id="current-project">—</span><span class="project-switch-caret">▾</span>
      </button>
      <div class="sidebar-title">Screens</div>
      <ul id="screen-list"></ul>
      <div class="screen-add">
        <input id="new-screen-name" type="text" name="new-screen-name" placeholder="New page"
          autocomplete="off" autocapitalize="off" spellcheck="false"
          data-lpignore="true" data-1p-ignore="true" data-form-type="other" />
        <button class="topbar-btn" id="screen-create" title="Add page">+</button>
      </div>
      <div class="screen-add-error" id="screen-add-error" hidden></div>
      <div class="pet-dock" id="pet-dock"></div>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="screen-name" id="screen-name">Login</div>
        <div class="device-switcher" id="device-switcher"></div>
        <button class="topbar-btn" id="save-btn">Save</button>
        <button class="topbar-btn" id="autosave-toggle">Auto-save: On</button>
        <button class="topbar-btn" id="editor-toggle">Hide code</button>
        <button class="topbar-btn" id="popout-toggle">Pop out</button>
        <button class="topbar-btn" id="link-toggle">Link</button>
        <button class="topbar-btn" id="play-toggle">Play</button>
        <button class="topbar-btn" id="overview-toggle">Overview</button>
        <button class="topbar-btn" id="export-toggle">Export</button>
        <button class="topbar-btn" id="color-toggle">Colors</button>
        <button class="topbar-btn" id="theme-toggle" title="Toggle light/dark">☾ Dark</button>
      </header>
      <main class="layout" id="layout">
        <section class="editor-pane">
          <div class="tabs">
            <button class="tab active" data-tab="html">HTML</button>
            <button class="tab" data-tab="css">CSS</button>
            <button class="tab" data-tab="globalCss">Global CSS</button>
          </div>
          <div id="editor-html" class="editor-container"></div>
          <div id="editor-css" class="editor-container" hidden></div>
          <div id="editor-globalCss" class="editor-container" hidden></div>
          <div id="conflict-banner" class="conflict-banner" hidden></div>
        </section>
        <section class="preview-pane">
          <div class="preview-scroll" id="preview-scroll">
            <div class="preview-stage" id="preview-stage">
              <div class="preview-frame" id="preview-frame">
                <iframe id="preview" sandbox="allow-scripts"></iframe>
              </div>
            </div>
            <div class="preview-popout-note" id="preview-popout-note" hidden>
              <div>Preview is open in a separate window.</div>
              <button class="topbar-btn" id="popout-return">Pop preview back in</button>
            </div>
          </div>
          <div class="preview-pan-overlay" id="preview-pan-overlay" hidden></div>
          <div class="preview-controls preview-controls-left">
            <button class="preview-ctrl-btn" id="zoom-out" title="Zoom out">−</button>
            <button class="preview-ctrl-btn" id="zoom-in" title="Zoom in">+</button>
          </div>
          <div class="preview-controls preview-controls-right">
            <button class="preview-ctrl-btn" id="pan-toggle" title="Pan (drag to move)">✋</button>
          </div>
          <div class="link-panel" id="link-panel" hidden>
            <span class="link-panel-label" id="link-panel-label">Click an element in the preview to link it.</span>
            <div class="link-panel-controls" id="link-panel-controls" hidden>
              <label>Go to
                <select id="link-target"></select>
              </label>
              <label>Open
                <select id="link-mode">
                  <option value="navigate">Navigate</option>
                  <option value="overlay">Overlay</option>
                </select>
              </label>
              <label>Transition
                <select id="link-transition">
                  <option value="instant">Instant</option>
                  <option value="dissolve">Dissolve</option>
                  <option value="slide-left">Slide left</option>
                  <option value="slide-right">Slide right</option>
                  <option value="slide-up">Slide up</option>
                  <option value="slide-down">Slide down</option>
                </select>
              </label>
              <button class="topbar-btn" id="link-save">Save link</button>
              <button class="topbar-btn" id="link-remove" hidden>Remove link</button>
            </div>
          </div>
        </section>
      </main>
      <section class="overview-board" id="overview-board" hidden></section>
    </div>
  </div>
  <div class="modal" id="projects-modal" hidden>
    <div class="modal-dialog">
      <div class="modal-head">
        <span>Projects</span>
        <button class="topbar-btn" id="projects-close">Close</button>
      </div>
      <ul class="projects-list" id="projects-list"></ul>
      <div class="projects-new">
        <input id="project-new-name" type="text" name="project-new-name" placeholder="New project name"
          autocomplete="off" autocapitalize="off" spellcheck="false"
          data-lpignore="true" data-1p-ignore="true" data-form-type="other" />
        <button class="topbar-btn" id="project-create">Create</button>
      </div>
      <div class="projects-error" id="projects-error" hidden></div>
    </div>
  </div>
  <div class="modal" id="export-modal" hidden>
    <div class="modal-dialog export-dialog">
      <div class="modal-head">
        <span>Export</span>
        <button class="topbar-btn" id="export-close">Close</button>
      </div>

      <div class="export-section">
        <div class="export-label">Pages</div>
        <div class="export-pages" id="export-pages"></div>
        <div class="export-pages-actions">
          <button class="topbar-btn" id="export-pages-all">All</button>
          <button class="topbar-btn" id="export-pages-none">None</button>
        </div>
      </div>

      <div class="export-section">
        <div class="export-label">Available now</div>
        <div class="export-grid">
          <button class="export-btn" id="export-prototype">
            <span class="export-btn-title">Prototype</span>
            <span class="export-btn-sub">.html · self-contained, playable offline</span>
          </button>
          <button class="export-btn" id="export-code">
            <span class="export-btn-title">Code</span>
            <span class="export-btn-sub">.zip · HTML/CSS source files</span>
          </button>
          <button class="export-btn" id="export-pdf">
            <span class="export-btn-title">PDF</span>
            <span class="export-btn-sub">print · one page each</span>
          </button>
        </div>
      </div>

      <div class="export-section">
        <div class="export-label">Coming soon <span class="export-soon-note">(needs a render pipeline)</span></div>
        <div class="export-grid">
          <button class="export-btn" disabled><span class="export-btn-title">Images</span><span class="export-btn-sub">.png per screen</span></button>
          <button class="export-btn" disabled><span class="export-btn-title">Mockups</span><span class="export-btn-sub">device frames (light/dark…)</span></button>
          <button class="export-btn" disabled><span class="export-btn-title">GIF</span><span class="export-btn-sub">animated walkthrough</span></button>
          <button class="export-btn" disabled><span class="export-btn-title">MP4</span><span class="export-btn-sub">video walkthrough</span></button>
        </div>
      </div>

      <div class="export-status" id="export-status" hidden></div>
    </div>
  </div>
  <div class="modal" id="color-modal" hidden>
    <div class="modal-dialog color-dialog">
      <div class="modal-head">
        <span>Color Picker</span>
        <button class="topbar-btn" id="color-close">Close</button>
      </div>
      <div class="color-mode">
        <button class="topbar-btn active" id="color-mode-solid">Solid</button>
        <button class="topbar-btn" id="color-mode-gradient">Gradient</button>
      </div>
      <div class="color-body">
        <div class="color-sv" id="color-sv">
          <div class="color-sv-thumb" id="color-sv-thumb"></div>
        </div>
        <div class="color-hue" id="color-hue">
          <div class="color-hue-thumb" id="color-hue-thumb"></div>
        </div>
        <div class="color-swatch" id="color-swatch"></div>
      </div>
      <div class="color-gradient" id="color-gradient" hidden>
        <div class="color-grad-opts">
          <label>Type
            <select id="color-grad-type">
              <option value="linear">Linear</option>
              <option value="radial">Radial</option>
              <option value="conic">Conic</option>
            </select>
          </label>
          <label class="color-angle-label">Angle
            <input id="color-angle" type="number" min="0" max="360" value="90" />
          </label>
          <label class="color-grad-repeat-label">
            <input id="color-grad-repeat" type="checkbox" /> Repeating
          </label>
        </div>
        <div class="color-stops" id="color-stops"></div>
        <button class="topbar-btn" id="color-stop-add">+ Add stop</button>
        <div class="color-grad-preview" id="color-grad-preview"></div>
      </div>
      <div class="color-fields">
        <label>R<input id="color-r" type="number" min="0" max="255" /></label>
        <label>G<input id="color-g" type="number" min="0" max="255" /></label>
        <label>B<input id="color-b" type="number" min="0" max="255" /></label>
        <label class="color-hex-field">HEX<input id="color-hex" type="text" maxlength="7" /></label>
      </div>
      <div class="color-copy">
        <button class="topbar-btn" id="color-copy-hex">Copy HEX</button>
        <button class="topbar-btn" id="color-copy-rgb">Copy RGB</button>
        <button class="topbar-btn" id="color-copy-grad" hidden>Copy Gradient</button>
        <span class="color-copied" id="color-copied" hidden>Copied!</span>
      </div>
    </div>
  </div>
  <div class="play-mode" id="play-mode" hidden>
    <div class="play-bar">
      <button class="topbar-btn" id="play-back">← Back</button>
      <span class="play-screen-name" id="play-screen-name"></span>
      <span class="play-bar-right">
        <button class="topbar-btn" id="play-flash">Flash hotspots</button>
        <button class="topbar-btn" id="play-exit">Exit</button>
      </span>
    </div>
    <div class="play-stage" id="play-stage">
      <iframe id="play-frame" sandbox="allow-scripts"></iframe>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
