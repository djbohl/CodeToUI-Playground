<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CodeToUI Playground</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-title">Project</div>
      <button class="project-switch" id="projects-toggle">
        <span id="current-project">—</span><span class="project-switch-caret">▾</span>
      </button>
      <div class="sidebar-title">Screens</div>
      <ul id="screen-list"></ul>
    </aside>
    <div class="main">
      <header class="topbar">
        <div class="screen-name" id="screen-name">Login</div>
        <div class="device-switcher" id="device-switcher"></div>
        <button class="topbar-btn" id="editor-toggle">Hide code</button>
        <button class="topbar-btn" id="popout-toggle">Pop out</button>
        <button class="topbar-btn" id="link-toggle">Link</button>
        <button class="topbar-btn" id="play-toggle">Play</button>
        <button class="topbar-btn" id="overview-toggle">Overview</button>
        <button class="topbar-btn" id="theme-toggle" title="Toggle light/dark">☾ Dark</button>
        <div class="status" id="sync-status">connecting…</div>
      </header>
      <main class="layout" id="layout">
        <section class="editor-pane">
          <div class="tabs">
            <button class="tab active" data-tab="html">HTML</button>
            <button class="tab" data-tab="css">CSS</button>
            <button class="tab" data-tab="globalCss">Global CSS</button>
          </div>
          <div id="editor-html" class="editor-container"></div>
          <div id="editor-css" class="editor-container" hidden></div>
          <div id="editor-globalCss" class="editor-container" hidden></div>
          <div id="conflict-banner" class="conflict-banner" hidden></div>
        </section>
        <section class="preview-pane">
          <div class="preview-scroll" id="preview-scroll">
            <div class="preview-stage" id="preview-stage">
              <div class="preview-frame" id="preview-frame">
                <iframe id="preview" sandbox="allow-scripts"></iframe>
              </div>
            </div>
            <div class="preview-popout-note" id="preview-popout-note" hidden>
              <div>Preview is open in a separate window.</div>
              <button class="topbar-btn" id="popout-return">Pop preview back in</button>
            </div>
          </div>
          <div class="preview-pan-overlay" id="preview-pan-overlay" hidden></div>
          <div class="preview-controls preview-controls-left">
            <button class="preview-ctrl-btn" id="zoom-out" title="Zoom out">−</button>
            <button class="preview-ctrl-btn" id="zoom-in" title="Zoom in">+</button>
          </div>
          <div class="preview-controls preview-controls-right">
            <button class="preview-ctrl-btn" id="pan-toggle" title="Pan (drag to move)">✋</button>
          </div>
          <div class="link-panel" id="link-panel" hidden>
            <span class="link-panel-label" id="link-panel-label">Click an element in the preview to link it.</span>
            <div class="link-panel-controls" id="link-panel-controls" hidden>
              <label>Go to
                <select id="link-target"></select>
              </label>
              <label>Open
                <select id="link-mode">
                  <option value="navigate">Navigate</option>
                  <option value="overlay">Overlay</option>
                </select>
              </label>
              <label>Transition
                <select id="link-transition">
                  <option value="instant">Instant</option>
                  <option value="dissolve">Dissolve</option>
                  <option value="slide-left">Slide left</option>
                  <option value="slide-right">Slide right</option>
                  <option value="slide-up">Slide up</option>
                  <option value="slide-down">Slide down</option>
                </select>
              </label>
              <button class="topbar-btn" id="link-save">Save link</button>
              <button class="topbar-btn" id="link-remove" hidden>Remove link</button>
            </div>
          </div>
        </section>
      </main>
      <section class="overview-board" id="overview-board" hidden></section>
    </div>
  </div>
  <div class="modal" id="projects-modal" hidden>
    <div class="modal-dialog">
      <div class="modal-head">
        <span>Projects</span>
        <button class="topbar-btn" id="projects-close">Close</button>
      </div>
      <ul class="projects-list" id="projects-list"></ul>
      <div class="projects-new">
        <input id="project-new-name" placeholder="New project name" autocomplete="off" />
        <button class="topbar-btn" id="project-create">Create</button>
      </div>
      <div class="projects-error" id="projects-error" hidden></div>
    </div>
  </div>
  <div class="play-mode" id="play-mode" hidden>
    <div class="play-bar">
      <button class="topbar-btn" id="play-back">← Back</button>
      <span class="play-screen-name" id="play-screen-name"></span>
      <span class="play-bar-right">
        <button class="topbar-btn" id="play-flash">Flash hotspots</button>
        <button class="topbar-btn" id="play-exit">Exit</button>
      </span>
    </div>
    <div class="play-stage" id="play-stage">
      <iframe id="play-frame" sandbox="allow-scripts"></iframe>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
